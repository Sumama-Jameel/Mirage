[package]
name = "obscura-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "obscura-gateway"
path = "src/main.rs"

[dependencies]
# Workspace crates
obscura-browser = { workspace = true, features = ["stealth"] }
obscura-net = { workspace = true }

# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, features = ["stream", "json", "multipart"] }
uuid = { workspace = true }
futures = "0.3"
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots", "url"] }

# Gateway-specific
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout"] }
tokio-stream = "0.1"
config = "0.14"
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
libloading = "0.8"
dirs = "5"
wasmtime = "24"
sha2 = "0.10"
tiktoken = "3"
sha3 = "0.10"
regex = "1"
rand = "0.8"
aes-gcm = "0.10"
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
snap = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
